name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      dynamodb:
        image: amazon/dynamodb-local@sha256:6ada631ec7aa5fc83446855eb17233e3dad184fec47477e8140c6c569cfe0c86
        ports:
          - 8000:8000
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Run tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Bundle Lambda
        run: npm run build:serverless
      - name: Test real conditional writes locally
        env:
          DYNAMODB_LOCAL_ENDPOINT: http://127.0.0.1:8000
        run: npm run test:serverless:integration
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install SAM CLI
        run: python -m pip install aws-sam-cli==1.171.0
      - name: Validate SAM infrastructure
        env:
          SAM_CLI_TELEMETRY: "0"
          AWS_EC2_METADATA_DISABLED: "true"
          AWS_DEFAULT_REGION: us-east-1
        run: bash scripts/sam-offline.sh validate --lint
      - name: Build SAM artifact
        env:
          SAM_CLI_TELEMETRY: "0"
          AWS_EC2_METADATA_DISABLED: "true"
          AWS_DEFAULT_REGION: us-east-1
        run: bash scripts/sam-offline.sh build
